<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Stream - Wildfire Intelligence Dashboard</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .info-box {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            max-width: 300px;
        }
        .info-box h2 { margin: 0 0 10px 0; font-size: 18px; color: #d9534f; }
        .legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px; }
    </style>
</head>
<body>

    <div class="info-box">
        <h2>🔥 Aegis Stream</h2>
        <p>Real-Time California Wildfire & Evacuation Engine</p>
        <div class="legend">
            <p><span style="background: red;"></span> Critical Evacuation Warning</p>
            <p><span style="background: orange;"></span> Monitoring</p>
        </div>
        <p id="stats-text">Loading statistics...</p>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map centered around California
        const map = L.map('map').setView([37.5, -119.5], 6);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Fetch data from FastAPI backend and plot points
        async function loadWildfireData() {
            try {
                const response = await fetch('/api/alerts');
                const result = await response.json();
                
                const statsResponse = await fetch('/api/stats');
                const statsResult = await statsResponse.json();

                let criticalCount = 0;
                statsResult.risk_distribution.forEach(item => {
                    if (item.risk_level === 'CRITICAL_EVACUATION_WARNING') criticalCount = item.count;
                });
                document.getElementById('stats-text').innerHTML = `<b>Total Events:</b> ${result.total_records}<br><b>Critical Warnings:</b> ${criticalCount}`;

                result.data.forEach(event => {
                    const color = event.risk_level === 'CRITICAL_EVACUATION_WARNING' ? 'red' : 'orange';
                    
                    const marker = L.circleMarker([event.latitude, event.longitude], {
                        radius: 8,
                        fillColor: color,
                        color: '#000',
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map);

                    marker.bindPopup(`
                        <b>Event ID:</b> ${event.event_id}<br>
                        <b>Risk Level:</b> ${event.risk_level}<br>
                        <b>Brightness:</b> ${event.brightness_k} K<br>
                        <b>Wind Speed:</b> ${event.wind_speed_kmh} km/h<br>
                        <b>Coordinates:</b> ${event.latitude}, ${event.longitude}
                    `);
                });
            } catch (error) {
                console.error('Error loading wildfire alerts:', error);
                document.getElementById('stats-text').innerText = 'Error connecting to FastAPI backend.';
            }
        }

        loadWildfireData();
    </script>
</body>
</html>
